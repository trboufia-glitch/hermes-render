app = "hermes-render"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  HERMES_HOME = "/app/.hermes"
  HERMES_GATEWAY_MODE = "polling"
  GATEWAY_ALLOW_ALL_USERS = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[vm]]
  memory_mb = 256
  cpu_kind = "shared"
  cpus = 1
